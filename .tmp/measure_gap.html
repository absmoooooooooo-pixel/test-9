<!doctype html>
<html><head><meta charset="utf-8"><title>gap measure</title></head><body>
<div id="out">pending</div>
<iframe id="f" src="/frontend/calculators/plate/index.html" style="width:390px;height:2400px;border:0"></iframe>
<script>
  var f = document.getElementById('f');
  f.onload = function () {
    setTimeout(function () {
      try {
        var d = f.contentDocument;
        var root = d.querySelector('[data-calculator-grade-panel]');
        var grades = root.querySelector('section');
        var formula = d.querySelector('h2[id$="FormulaTitle"]').closest('section');
        var gr = grades.getBoundingClientRect(), fr = formula.getBoundingClientRect();
        var out = {
          viewport: f.contentWindow.innerWidth,
          gapPx: Math.round((fr.top - gr.bottom) * 100) / 100,
          gradesRootMarginBottom: f.contentWindow.getComputedStyle(root).marginBottom,
          gradesSectionPaddingBottom: f.contentWindow.getComputedStyle(grades).paddingBottom,
          formulaMarginTop: f.contentWindow.getComputedStyle(formula).marginTop,
          formulaMarginBottom: f.contentWindow.getComputedStyle(formula).marginBottom,
          gridDisplay: f.contentWindow.getComputedStyle(d.querySelector('main.app')).display
        };
        document.getElementById('out').textContent = JSON.stringify(out);
      } catch (e) { document.getElementById('out').textContent = 'ERR ' + e.message; }
    }, 2500);
  };
</script>
</body></html>
