    <path d="M12.4-1.6Q13.9-6.8 18.4-8.2" fill="none" stroke="#064b48" stroke-width="1.8" stroke-linecap="round" opacity=".16"/>
    <path d="M22 7.6Q26.2 6.2 27.9 2.2" fill="none" stroke="#e8fffb" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
