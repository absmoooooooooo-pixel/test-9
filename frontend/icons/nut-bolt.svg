<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Nut and bolt">
  <g transform="translate(60 60) rotate(-45) scale(1) translate(10 0)">
    <!-- shadow: dark copy offset toward bottom-right in screen space -->
    <g fill="#075d59" transform="translate(0.3 4.5)">
      <path d="M-63 0-54-15.59H-36L-27 0-36 15.59H-54Z"/>
      <path d="M-40-10.5H34V10.5H-40Z"/>
      <path d="M43 0 31.5-19.92H8.5L-3 0l11.5 19.92H31.5Z"/>
    </g>

    <!-- shank -->
    <path d="M-40-10.5H34V10.5H-40Z" fill="#16a9a0" stroke="#064b48" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-32-6.3H-8" fill="none" stroke="#b8fff6" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>
    <path d="M-32 7H-8" fill="none" stroke="#023d39" stroke-width="2" stroke-linecap="round" opacity=".22"/>

    <!-- thread turns -->
