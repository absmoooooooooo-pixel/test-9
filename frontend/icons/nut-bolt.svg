      <path d="M-16-10q3.4 10.5 0 21"/>
      <path d="M-10-10q3.4 10.5 0 21"/>
    </g>

    <!-- bolt head -->
    <path d="M-63 0-54-15.59H-36L-27 0-36 15.59H-54Z" fill="#16a9a0" stroke="#064b48" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-54-15.59h18l2.42 4.19H-56.42Z" fill="#6fe3d7"/>
    <path d="M-56-10.6H-33.9" fill="none" stroke="#064b48" stroke-width="1.4" opacity=".2"/>
    <path d="M-59.4-3.2-55.6-9.8" fill="none" stroke="#d4fff9" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>

    <!-- nut -->
    <path d="M43 0 31.5-19.92H8.5L-3 0l11.5 19.92H31.5Z" fill="#16a9a0" stroke="#064b48" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M8.5-19.92h23l3.71 6.42H4.79Z" fill="#6fe3d7"/>
    <path d="M5-12.6H35.1" fill="none" stroke="#064b48" stroke-width="1.4" opacity=".2"/>
    <path d="M-0.4-5.2 6.2-13.2" fill="none" stroke="#a9f7ef" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
    <path d="M37.4 12.6 41.4 5.6" fill="none" stroke="#023d39" stroke-width="2.4" stroke-linecap="round" opacity=".25"/>

    <!-- nut bore -->
